<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproducción de Video con Detección</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        img, video {
            width: 1020px;
            height: 600px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 10px;
        }

        a {
            text-decoration: none;
            color: #007bff;
            font-size: 18px;
            margin-top: 10px;
            margin-left: 10px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Video con Detección y Seguimiento de Tamaño</h1>

    <img src="{{ url_for('video_feed', filename=filename) }}" alt="Video con detección en vivo" />

    <video controls>
        <source src="{{ url_for('send_video', filename=filename) }}" type="video/mp4">
        Tu navegador no soporta el video.
    </video>

    <div>
        <a href="{{ url_for('send_video', filename=filename) }}" download>Descargar video original</a>
        <a href="{{ url_for('send_annotated_video', filename=filename) }}" download>Descargar video anotado</a>
    </div>
    
    <a href="/">Regresar al inicio</a>
</body>
</html>
